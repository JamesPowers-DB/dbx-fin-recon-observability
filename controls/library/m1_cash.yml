# M1 Cash: bank-to-book reconciliation (bank feed camt.053 vs Oracle GL cash).
module: M1
module_name: Cash (bank-to-book)
slice:
  sources: [bank/camt053_*.xml]
  pipelines: [pipelines/m1_cash]
  tables_owned: [bronze_bank_camt053_stmt, silver_bank_statement, silver_bank_entry, gold_m1_book_cash_lines,
                 gold_m1_cash_match, gold_m1_cash_recon, gold_m1_population, gold_m1_exceptions]
controls:
  - control_id: CASH-01
    version: 1
    title: Bank statements received for every business day
    objective: Every bank account has a statement for every business day, so cash is reconciled on complete data.
    risk_ids: [R1, R7]
    key_control: false
    assertions: [completeness]
    nature: {type: detective, automation: automated, line_of_defense: 1}
    lane: management
    frequency: daily
    owner_role: Treasury Analyst
    population: {dataset: silver_bank_statement, unit: account-day, description: Expected statement days per account (business days up to yesterday)}
    parameters: {}
    tolerance: {max_exceptions: 0}
    executed_by: {kind: expectation, job: run_controls, task: test_update, dataset: silver_m1_statement_continuity, expectation: ctl_cash_01}
    exceptions_dataset: gold_m1_exceptions
    test_sql_file: pipelines/m1_cash/silver/statement_continuity.sql
    evidence: {policy_ref: POL-FC-01 2.1, documents: []}
    signoff: {preparer_role: Treasury Analyst, reviewer_role: Controller, four_eyes: true}
    lifecycle: {state: operating, effective_from: 2026-01-01}
    traditional_sample_size: 25

  - control_id: CASH-02
    version: 1
    title: Every bank transaction matches a book entry
    objective: Bank transactions and GL cash entries match one-to-one on account, reference (EndToEndId) and amount. Items unmatched for more than five business days are exceptions.
    risk_ids: [R1]
    key_control: true
    assertions: [existence, completeness]
    nature: {type: detective, automation: automated, line_of_defense: 1}
    lane: management
    frequency: daily
    owner_role: Treasury Analyst
    population: {dataset: gold_m1_cash_match, unit: transaction, description: All bank entries and GL cash lines}
    parameters: {aging_bd: 5}
    tolerance: {max_exceptions: 0}
    executed_by: {kind: pipeline_dataset, job: run_controls, task: test_update, dataset: gold_m1_exceptions}
    exceptions_dataset: gold_m1_exceptions
    test_sql_file: pipelines/m1_cash/gold/control_tests.sql
    evidence: {policy_ref: POL-FC-01 2.2, documents: [bank_advices]}
    signoff: {preparer_role: Treasury Analyst, reviewer_role: Controller, four_eyes: true}
    lifecycle: {state: operating, effective_from: 2026-01-01}
    traditional_sample_size: 40

  - control_id: CASH-03
    version: 1
    title: Unexplained bank-to-book difference within $1
    objective: For each bank account and month, the difference between bank and book not explained by timing items is at most USD 1.00 equivalent.
    risk_ids: [R1]
    key_control: true
    assertions: [accuracy]
    nature: {type: detective, automation: automated, line_of_defense: 1}
    lane: management
    frequency: monthly
    owner_role: Treasury Analyst
    population: {dataset: gold_m1_cash_recon, unit: account-month, description: Bank account x month reconciliations}
    parameters: {max_unexplained_usd: 1.0, aging_bd: 5}
    tolerance: {max_exceptions: 0}
    executed_by: {kind: pipeline_dataset, job: run_controls, task: test_update, dataset: gold_m1_exceptions}
    exceptions_dataset: gold_m1_exceptions
    test_sql_file: pipelines/m1_cash/gold/cash_recon.sql
    evidence: {policy_ref: POL-FC-01 2.3, documents: []}
    signoff: {preparer_role: Treasury Analyst, reviewer_role: Controller, four_eyes: true}
    lifecycle: {state: operating, effective_from: 2026-01-01}
    traditional_sample_size: 12

  - control_id: CASH-04
    version: 1
    title: Aged reconciling items supported by a bank advice
    objective: Bank-side reconciling items older than five business days are supported by a bank advice whose reference and amount agree (parsed from the PDF with ai_parse_document).
    risk_ids: [R1, R5]
    key_control: false
    assertions: [existence]
    nature: {type: detective, automation: it_dependent_manual, line_of_defense: 1}
    lane: management
    frequency: daily
    owner_role: Treasury Analyst
    population: {dataset: gold_m1_cash_match, unit: reconciling item, description: Bank-side unmatched items aged over five business days}
    parameters: {aging_bd: 5}
    tolerance: {max_exceptions: 0}
    executed_by: {kind: pipeline_dataset, job: run_controls, task: test_update, dataset: gold_m1_exceptions}
    exceptions_dataset: gold_m1_exceptions
    test_sql_file: pipelines/m1_cash/gold/control_tests.sql
    evidence: {policy_ref: POL-FC-01 2.4, documents: [bank_advices]}
    signoff: {preparer_role: Treasury Analyst, reviewer_role: Controller, four_eyes: true}
    lifecycle: {state: operating, effective_from: 2026-01-01}
    traditional_sample_size: 15
