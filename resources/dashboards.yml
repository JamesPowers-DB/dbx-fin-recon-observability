resources:
  dashboards:
    continuous_close:
      display_name: "Fin Recon Observability - Continuous Close"
      file_path: ../dashboards/continuous_close.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.file_path}/dashboards
      # Dataset queries use unqualified names (gold_mv_*); these bind them to the
      # target catalog/schema so the JSON stays environment-neutral.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      permissions:
        - level: CAN_RUN
          group_name: users
