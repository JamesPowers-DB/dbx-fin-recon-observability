resources:
  # Lakebase Autoscaling project for app-owned operational state (review
  # actions, working papers, chat sessions). The deployer becomes the project
  # owner with a DATABRICKS_SUPERUSER role, which lets the snapshot_review_state
  # task read the tables the app service principal creates. The app binds the
  # default `databricks-postgres` database (resources/apps.yml), which gives its
  # service principal a Postgres role with CONNECT + CREATE.
  postgres_projects:
    audit_lakebase:
      project_id: ${var.lakebase_project}
      display_name: Fin Recon Observability - Audit Workbench
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: 300s
