resources:
  alerts:
    critical_open_exceptions:
      display_name: "Fin Recon Observability - Critical open exceptions (active close)"
      warehouse_id: ${var.warehouse_id}
      # Escalation: open exceptions in the active close rated critical by AI triage
      # or by rule (key control and >= USD 250k). Governed definition from the
      # metric view, so the alert, the app and Genie count the same thing.
      query_text: >-
        SELECT MEASURE(critical_open_exceptions) AS critical_open
        FROM ${var.catalog}.${var.schema}.gold_mv_exceptions
        WHERE period = date_format(current_date(), 'yyyy-MM')
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: critical_open
          display: critical_open
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_schedule: "0 15 6,12,18 * * ?"
        timezone_id: UTC
      permissions:
        - level: CAN_RUN
          group_name: users
